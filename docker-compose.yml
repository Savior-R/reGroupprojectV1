name: shijiangtai

services:
  postgres:
    image: postgres:18-alpine
    # 开机 / Docker Desktop 重启后自动拉起；数据在命名卷 postgres-data 中
    restart: unless-stopped
    environment:
      POSTGRES_DB: shijiangtai
      POSTGRES_USER: shijiangtai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shijiangtai_dev}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./server/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shijiangtai -d shijiangtai"]
      interval: 5s
      timeout: 3s
      retries: 20

  flyway:
    profiles: ["migrate"]
    image: flyway/flyway:12
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./server/src/main/resources/db/migration:/flyway/sql:ro
    command:
      - "-url=jdbc:postgresql://postgres:5432/shijiangtai_test"
      - "-user=shijiangtai"
      - "-password=${POSTGRES_PASSWORD:-shijiangtai_dev}"
      - "-locations=filesystem:/flyway/sql"
      - "-placeholderReplacement=false"
      - "migrate"

  flyway-demo:
    profiles: ["demo"]
    image: flyway/flyway:12
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./server/src/main/resources/db/migration:/flyway/sql:ro
      - ./server/src/main/resources/db/demo:/flyway/demo:ro
    command:
      - "-url=jdbc:postgresql://postgres:5432/shijiangtai_demo"
      - "-user=shijiangtai"
      - "-password=${POSTGRES_PASSWORD:-shijiangtai_dev}"
      - "-locations=filesystem:/flyway/sql,filesystem:/flyway/demo"
      - "-placeholderReplacement=false"
      - "migrate"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai
    environment:
      AI_MOCK: ${AI_MOCK:-true}
      SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./server
    # 容器内也要拿到 M1_JWT_SECRET / M1_EMAIL_CODE_SECRET / M1_INTERNAL_TOKEN / M1_MAIL_*；
    # spring.config.import 读的是工作目录下的 .env，容器内没有该文件，故用 env_file 注入。
    env_file:
      - ./server/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shijiangtai?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: shijiangtai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shijiangtai_dev}
      SPRING_DATA_REDIS_HOST: redis
      M3_MINIO_ENDPOINT: http://minio:9000
      M3_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      M3_MINIO_REGION: ${M3_MINIO_REGION:-us-east-1}
      M3_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      M3_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      M3_MINIO_BUCKET: shijiangtai
      M3_AI_BASE_URL: http://ai:8001
      M3_AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
    # 宿主机 8090 → 容器 8080：8080 已被本机其他项目（file-transfer-nginx-1）占用
    # 仅本地调试需要；生产请删除此行，只经 nginx 网关暴露。
    # 直连本端口会绕过限流，且 dev profile 接受 X-Account-* 请求头身份。
    ports: ["8090:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      ai: { condition: service_healthy }

  test:
    profiles: ["test"]
    image: gradle:8.14.3-jdk21
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./server:/workspace
      - gradle-cache:/home/gradle/.gradle
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shijiangtai_test?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: shijiangtai
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shijiangtai_dev}
      M3_STORAGE: memory
    depends_on:
      postgres: { condition: service_healthy }
    command: ["gradle", "test", "--no-daemon", "--console=plain"]

  # Nginx 网关（可选，02 §2.2）：验证 auth_request 链路时启用
  # docker compose --profile gateway up -d nginx  →  http://localhost:8081
  # 默认不启动：本机 8080 已被其他项目占用，日常直连 app:8080 即可
  nginx:
    profiles: ["gateway"]
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    # 与 app 共用同一份 .env，保证内部令牌一致（否则 /_auth 一律 401）
    env_file:
      - ./server/.env
    environment:
      JAVA_UPSTREAM: app:8080
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      app: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  gradle-cache:
